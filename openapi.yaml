  schemas:
    UUID:
      type: string
      format: uuid
      description: UUID v4.
    TreeStatus:
      type: string
      enum:
      - HEALTHY
      - WARNING
      - DEAD
      - UNKNOWN
    CropInput:
      type: object
      required:
      - name
      - row_spacing
      - tree_spacing
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        variety:
          type: string
          maxLength: 60
        row_spacing:
          type: string
          pattern: ^(?=.*[1-9])[0-9]+([.,][0-9]{1,3})?$
          description: Десятичная строка. В запросе допустимы точка и запятая, в ответе используется точка.
        tree_spacing:
          type: string
          pattern: ^(?=.*[1-9])[0-9]+([.,][0-9]{1,3})?$
          description: Десятичная строка. В запросе допустимы точка и запятая, в ответе используется точка.
        prefix:
          type: string
          description: При отсутствии сервер формирует префикс из названия.
    Crop:
      type: object
      required:
      - id
      - name
      - row_spacing
      - tree_spacing
      - prefix
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          minLength: 1
          maxLength: 60
        variety:
          type: string
          maxLength: 60
        row_spacing:
          type: string
          pattern: ^(?=.*[1-9])[0-9]+([.,][0-9]{1,3})?$
          description: Десятичная строка. В запросе допустимы точка и запятая, в ответе используется точка.
        tree_spacing:
          type: string
          pattern: ^(?=.*[1-9])[0-9]+([.,][0-9]{1,3})?$
          description: Десятичная строка. В запросе допустимы точка и запятая, в ответе используется точка.
        prefix:
          type: string
          description: При отсутствии сервер формирует префикс из названия.
    GardenInput:
      type: object
      required:
      - name
      - crop_id
      - area_ha
      - planting_date
      - places_per_row
      properties:
        name:
          type: string
          minLength: 1
        crop_id:
          $ref: '#/components/schemas/UUID'
        area_ha:
          type: string
          pattern: ^(?=.*[1-9])[0-9]+([.,][0-9]{1,4})?$
          description: Десятичная строка. В запросе допустимы точка и запятая, в ответе используется точка.
        planting_date:
          type: string
          format: date
        places_per_row:
          type: integer
          minimum: 1
          maximum: 100
    Garden:
      type: object
      required:
      - id
      - name
      - crop_id
      - area_ha
      - planting_date
      - places_per_row
      - initial_tree_count
      - finance
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          minLength: 1
        crop_id:
          $ref: '#/components/schemas/UUID'
        area_ha:
          type: string
          pattern: ^(?=.*[1-9])[0-9]+([.,][0-9]{1,4})?$
          description: Десятичная строка. В запросе допустимы точка и запятая, в ответе используется точка.
        planting_date:
          type: string
          format: date
        places_per_row:
          type: integer
          minimum: 1
          maximum: 100
        initial_tree_count:
          type: integer
          minimum: 1
          maximum: 10000
        finance:
          $ref: '#/components/schemas/Finance'
    Finance:
      type: object
      required:
      - revenue_cents
      - annual_revenue_cents
      - annual_costs_cents
      properties:
        revenue_cents:
          type: integer
          format: int64
          minimum: 0
        annual_revenue_cents:
          type: integer
          format: int64
          minimum: 0
        annual_costs_cents:
          type: integer
          format: int64
          minimum: 0
    Tree:
      type: object
      required:
      - id
      - row
      - place
      - status
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        row:
          type: integer
          minimum: 1
        place:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TreeStatus'
    TreeLookup:
      type: object
      required:
      - garden_id
      - tree
      properties:
        garden_id:
          $ref: '#/components/schemas/UUID'
        tree:
          $ref: '#/components/schemas/Tree'
    AiResult:
      type: object
      required:
      - diagnosis
      - recommendations
      properties:
        diagnosis:
          type: string
          minLength: 1
        recommendations:
          type: string
          minLength: 1
    ObservationInput:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/TreeStatus'
        comment:
          type: string
        diagnosis:
          type: string
        recommendations:
          type: string
        sample_photo:
          type: boolean
        photo:
          type: string
          format: binary
          description: JPEG или PNG, до 10 МБ.
        original_ai:
          $ref: '#/components/schemas/AiResult'
    Observation:
      type: object
      required:
      - id
      - garden_id
      - tree_id
      - created_at
      - status
      - comment
      - diagnosis
      - recommendations
      - sample_photo
      - photo_path
      - original_ai
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        garden_id:
          $ref: '#/components/schemas/UUID'
        tree_id:
          $ref: '#/components/schemas/UUID'
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TreeStatus'
        comment:
          type: string
        diagnosis:
          type: string
        recommendations:
          type: string
        sample_photo:
          type: boolean
        photo_path:
          type:
          - string
          - 'null'
          description: Относительный путь к фотографии в объектном хранилище.
        original_ai:
          anyOf:
          - $ref: '#/components/schemas/AiResult'
          - type: 'null'
    DiagnosisInput:
      type: object
      properties:
        photo:
          type: string
          format: binary
          description: JPEG или PNG, до 10 МБ.
        sample_photo:
          type: boolean
      anyOf:
      - required:
        - photo
      - required:
        - sample_photo
        properties:
          sample_photo:
            const: true
    ZoneInput:
      type: object
      required:
      - name
      - color
      - tree_ids
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: integer
          enum:
          - 0
          - 1
          - 2
        tree_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
    Zone:
      type: object
