          description: Дата и время ISO 8601; допускается местное время без смещения.
          example: 2026-10-30T07:00
        end:
          type: string
          description: Дата и время ISO 8601; допускается местное время без смещения.
          example: 2026-10-30T07:00
    ExpenseInput:
